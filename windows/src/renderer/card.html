<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Clawd Buddy</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <div class="card" id="card">
    <div class="head" id="head">
      <canvas id="crab"></canvas>
      <div class="titles">
        <div class="title" id="title"></div>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <button class="copy" id="copy"></button>
      <button class="ring" id="ring" hidden>
        <svg viewBox="0 0 28 28"><circle class="track" cx="14" cy="14" r="11"/><circle class="left" id="ringLeft" cx="14" cy="14" r="11"/></svg>
      </button>
    </div>
    <div class="approval" id="approval" hidden>
      <pre class="command" id="command"></pre>
      <div class="warn" id="tooLong" hidden></div>
      <div class="buttons">
        <button class="pill" id="deny"></button>
        <button class="pill main" id="allow"></button>
      </div>
    </div>
    <div class="answer" id="answer"></div>
    <form class="ask" id="ask">
      <input id="input" type="text" autocomplete="off" spellcheck="false">
      <button class="send" id="send" type="submit" aria-label="Send">↑</button>
    </form>
  </div>
  <script src="strings.js"></script>
  <script src="buddy-view.js"></script>
  <script src="card.js"></script>
</body>
</html>
