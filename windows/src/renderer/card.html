<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Clawd Buddy</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <div class="card" id="card">
    <div class="head" id="head">
      <canvas id="crab"></canvas>
      <div class="titles">
        <div class="title" id="title"></div>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <button class="copy" id="copy"></button>
    </div>
    <div class="answer" id="answer"></div>
    <form class="ask" id="ask">
      <input id="input" type="text" autocomplete="off" spellcheck="false">
      <button class="send" id="send" type="submit" aria-label="Send">↑</button>
    </form>
  </div>
  <script src="strings.js"></script>
  <script src="buddy-view.js"></script>
  <script src="card.js"></script>
</body>
</html>
