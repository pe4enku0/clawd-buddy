name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The hook plumbing edits the user's global settings.json, so it is the one part that must never
  # regress unnoticed. The tests use only Node built-ins, so they need no install step.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ClawdBuddy-windows
          path: windows/dist/*.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./macos/build.sh
      - run: ditto -c -k --keepParent macos/build/ClawdBuddy.app ClawdBuddy-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClawdBuddy-macos
          path: ClawdBuddy-macos.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The tag names the release, but the installer name, the settings footer and the macOS bundle
      # version come from three different files. Refuse to publish a release that disagrees.
      - name: Check the tag matches both app versions
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
